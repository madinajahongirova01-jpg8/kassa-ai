name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx next typegen && npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build (includes TypeScript type checking)
        run: npm run build

  api:
    name: API (lint, typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kassa
          POSTGRES_PASSWORD: kassa_ci_password
          POSTGRES_DB: kassa_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kassa -d kassa_ai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://kassa:kassa_ci_password@localhost:5432/kassa_ai_test?schema=public
      TEST_DATABASE_URL: postgresql://kassa:kassa_ci_password@localhost:5432/kassa_ai_test?schema=public
      JWT_SECRET: ci-only-jwt-secret-that-is-not-used-anywhere-else

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Apply migrations to the CI database
        run: npm run prisma:migrate:deploy

      - name: E2E tests (Auth, customers, debts, payments)
        run: npm run test:e2e

      - name: Build
        run: npm run build
