name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx next typegen && npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build (includes TypeScript type checking)
        run: npm run build

  api:
    name: API (lint, typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kassa
          POSTGRES_PASSWORD: kassa_ci_password
          POSTGRES_DB: kassa_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kassa -d kassa_ai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://kassa:kassa_ci_password@localhost:5432/kassa_ai_test?schema=public
      TEST_DATABASE_URL: postgresql://kassa:kassa_ci_password@localhost:5432/kassa_ai_test?schema=public
      JWT_SECRET: ci-only-jwt-secret-that-is-not-used-anywhere-else

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Apply migrations to the CI database
        run: npm run prisma:migrate:deploy

      - name: E2E tests (Auth, customers, debts, payments)
        run: npm run test:e2e

      - name: Build
        run: npm run build

  browser:
    name: Browser tests (Playwright, Chromium)
    needs: [frontend, api]
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kassa
          POSTGRES_PASSWORD: kassa_ci_password
          POSTGRES_DB: kassa_ai_browser
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kassa -d kassa_ai_browser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://kassa:kassa_ci_password@localhost:5432/kassa_ai_browser?schema=public
      JWT_SECRET: ci-only-browser-jwt-secret-not-used-anywhere-else
      AUTH_THROTTLE_LIMIT: "1000"
      ENTRY_PARSE_THROTTLE_LIMIT: "1000"
      GEMINI_API_KEY: ""
      KASSA_API_URL: http://localhost:3001

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/api/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install API dependencies
        working-directory: apps/api
        run: npm ci

      - name: Prepare the API database
        working-directory: apps/api
        run: |
          npm run prisma:generate
          npm run prisma:migrate:deploy

      - name: Build API
        working-directory: apps/api
        run: npm run build

      - name: Build frontend
        run: npm run build

      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Browser tests
        run: npm run test:browser

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
